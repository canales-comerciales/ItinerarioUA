const KEY='ua-ba-vip-v1';let state={country:null,tab:'itinerary',day:0,packed:[false,false,false,false,false]};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved.country&&COUNTRIES[saved.country])state.country=saved.country;if(Number.isInteger(saved.day)&&saved.day>=0&&saved.day<4)state.day=saved.day;if(Array.isArray(saved.packed)&&saved.packed.length===5)state.packed=saved.packed.map(Boolean)}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify({country:state.country,day:state.day,packed:state.packed}))}catch(e){}}function go(tab){state.tab=tab;render();window.scrollTo(0,0)}const app=document.getElementById('app');

function welcome(){return `<div class="welcome"><section class="hero"><img class="brand" src="${LOGO}" alt="Universal Assistance"><div><div class="eyebrow">Una experiencia exclusiva</div><h1>¡Bienvenidos a<br>Buenos Aires!</h1><p>Preparamos días increíbles para que disfrutes, descubras y vivas Buenos Aires de una manera especial.</p></div></section><section class="body"><h2 class="heading">Tu aventura comienza acá</h2><p class="muted">Selecciona tu país para comenzar esta experiencia</p>${Object.entries(COUNTRIES).map(([k,c])=>`<button class="country" data-country="${k}"><img class="flag-img" src="${FLAGS[k]}" alt="Bandera de ${c.name}" loading="lazy">${c.name}<span class="arrow">→</span></button>`).join('')}<div class="footer">Universal Assistance · Experiencia Buenos Aires</div></section></div>`}
function itinerary(){const d=DAYS[state.day];return `<div class="eyebrow" style="color:#00758b">✦ Tu agenda VIP</div><h2 class="heading">Cada día, una nueva historia</h2><div class="days">${DAYS.map((x,i)=>`<button class="day ${i===state.day?'active':''}" data-day="${i}" aria-pressed="${i===state.day}">${x.short}<b>${x.date}</b></button>`).join('')}</div><h3 class="heading" style="font-size:19px">${d.title}</h3><div class="timeline">${d.events.map(e=>`<article class="activity ${e[3]==='special'?'special':''}"><div class="time">${e[0]}</div><h3>${e[1]}</h3><p>${e[2]}</p>${e[3]==='optional'?'<span class="tag">Opcional</span>':''}</article>`).join('')}</div>${state.day===3?'<button class="action" data-tab="transfers">Ver indicaciones de regreso →</button>':''}`}
function packing(){const n=state.packed.filter(Boolean).length;return `<div class="eyebrow" style="color:#00758b">✦ Antes de viajar</div><h2 class="heading">¡Prepara tu valija! 🧳</h2><p class="muted">Queremos que disfrutes cada momento. Te compartimos algunos imprescindibles para tu experiencia en Buenos Aires.</p><strong style="font-size:13px">${n} de 5 imprescindibles listos</strong><div class="progress"><div style="width:${n*20}%"></div></div>${PACK.map((p,i)=>`<button class="pack ${state.packed[i]?'checked':''}" data-pack="${i}" aria-pressed="${state.packed[i]}"><span class="emoji">${p[0]}</span><span class="copy"><strong>${p[1]}</strong><small>${p[2]}</small></span><span class="check">${state.packed[i]?'✓':''}</span></button>`).join('')}<div class="closing"><h3>De los detalles nos ocupamos nosotros.</h3><p>¡Vos solo preparate para disfrutar!</p></div>`}
function transfers(){const c=COUNTRIES[state.country];const contact=(tipo)=>c.phone?`<a class="action whatsapp" target="_blank" rel="noopener noreferrer" href="https://wa.me/${c.phone}?text=${encodeURIComponent('¡Hola! Soy parte de la experiencia de Universal Assistance en Buenos Aires y quería coordinar mi traslado de '+tipo+'.')}">WhatsApp · ${c.contact} ↗</a>`:'';return `<div class="eyebrow" style="color:#00758b">✦ Tu viaje, paso a paso</div><h2 class="heading">Tus traslados</h2><p class="muted">${c.name} · Encontrá rápidamente qué hacer al llegar y cómo regresar.</p><article class="info arrival-card"><div class="transfer-step"><span class="number">1</span><strong>Al llegar a Buenos Aires</strong></div><p>${c.arrival}</p>${c.warning?`<div class="notice">⚠ <strong>Antes de salir:</strong> ${c.warning.replace('IMPORTANTE: ','')}</div>`:''}${contact('llegada')}</article><article class="info return-card"><div class="transfer-step"><span class="number">2</span><strong>Para regresar a ${c.name}</strong></div><p>${c.return}</p>${c.vip?`<div class="vip-inline"><strong>✦ VIP Pass incluido</strong><p>${c.vip}</p></div>`:''}${contact('regreso')}</article><article class="info"><div class="time">📍 TU HOTEL</div><h3>${HOTEL.name}</h3>${HOTEL.address?`<p class="hotel-address">${HOTEL.address}</p>`:'<p>Dirección pendiente de confirmación.</p>'}${HOTEL.maps?`<a class="action" target="_blank" rel="noopener noreferrer" href="${HOTEL.maps}">📍 Abrir en Google Maps ↗</a>`:''}</article>`}
function closing(){return `<section class="closing"><h3>¡Gracias por ser parte de esta experiencia!</h3><p>Esperamos que disfrutes cada momento y te lleves recuerdos inolvidables de Buenos Aires.</p><button class="action" data-tab="itinerary">Volver al itinerario →</button></section>`}
function render(){if(!state.country){app.innerHTML=welcome();return}const c=COUNTRIES[state.country];app.innerHTML=`<section class="hero"><div class="top"><img class="brand" src="${LOGO}" alt="Universal Assistance"><button class="change" data-change="1"><img class="flag-img small" src="${FLAGS[state.country]}" alt=""> ${c.name} ⌄</button></div><div style="margin-top:34px" class="eyebrow">Universal Assistance presenta</div><h1>Tu experiencia en<br>Buenos Aires</h1><p>Descubre todo lo que preparamos para ti.</p></section><section class="body">${state.tab==='itinerary'?itinerary():state.tab==='packing'?packing():transfers()}</section><nav class="nav" aria-label="Navegación principal">${[['itinerary','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h3"/></svg>','Itinerario'],['packing','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M12 7v14M4 13h16"/></svg>','Mi valija'],['transfers','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 11l7 3 3 7 8-18ZM10 14l5-5"/></svg>','Traslados']].map(x=>`<button data-tab="${x[0]}" class="${state.tab===x[0]?'active':''}" aria-current="${state.tab===x[0]?'page':'false'}"><span aria-hidden="true">${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.country){state.country=b.dataset.country;state.tab='itinerary';save();go('itinerary')}else if(b.dataset.change){state.country=null;save();render();window.scrollTo(0,0)}else if(b.dataset.tab){go(b.dataset.tab)}else if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);save();render()}else if(b.dataset.pack!==undefined){const i=Number(b.dataset.pack);state.packed[i]=!state.packed[i];save();render()}});render();
